name: Cross-browser tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    name: Playwright (Chrome, Brave, WebKit)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Chrome and Brave
        run: |
          brew install --cask google-chrome brave-browser
      - run: npm ci
      - run: npx playwright install webkit
      - run: npm test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/junit.xml
          if-no-files-found: warn

  selenium-nunit:
    name: Selenium + NUnit (${{ matrix.browser }})
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, brave, safari]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install browsers and enable Safari automation
        run: |
          if [ "${{ matrix.browser }}" = "chrome" ]; then
            brew install --cask google-chrome
          elif [ "${{ matrix.browser }}" = "brave" ]; then
            brew install --cask brave-browser
          else
            sudo safaridriver --enable
          fi
      - name: Run NUnit suite
        env:
          BROWSER: ${{ matrix.browser }}
        run: dotnet test tests/selenium/BookingTests.csproj --logger "console;verbosity=normal" --logger "trx;LogFileName=results-${{ matrix.browser }}.trx"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-report-${{ matrix.browser }}
          path: tests/selenium/TestResults/*.trx
          if-no-files-found: warn
